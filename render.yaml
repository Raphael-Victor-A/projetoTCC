# Blueprint do Render: cria a API (FastAPI) e o site estatico (React/Vite).
# O banco Postgres fica no Neon (gratis e nao expira); cole a connection
# string em DATABASE_URL no painel do Render.
services:
  - type: web
    name: tcc-backend
    runtime: python
    rootDir: backend
    plan: free
    # Mesma regiao do banco no Neon (AWS US East 2 / Ohio) para baixa latencia
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: tcc-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        sync: false
    routes:
      # SPA: qualquer rota (/dashboard, /admin...) devolve o index.html
      - type: rewrite
        source: /*
        destination: /index.html
